<style>
:root{
  --bg:#070a10; --bg-2:#0b1017; --bg-3:#131a24; --bg-4:#1b2430;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --text:#e9eef4; --text-dim:#9aa7b6; --text-mute:#5f6b7a;
  /* 2026-08-30 (Ignacio) · unificado con la marca. Los dos turquesas eran casi el MISMO
     tono —182,9° la app contra 189,0° este— y solo diferian en saturacion y luminosidad.
     Y el corporativo #42A5AA NO es ilegible aqui: da 5,99:1 sobre este fondo, por encima
     del minimo de 4,5 (yo dije «apagado» hablando de brillo, no de legibilidad).
     Asi que en vez de elegir entre uno u otro, se ACLARA el corporativo sin cambiarle el
     tono: misma marca, y el brillo que pide un fondo oscuro. Contraste 9,55:1. */
  --accent:#68CFD4; --accent-strong:#90DCE0; --accent-deep:#1D6467;
  --claude:#5ad1e6; --aurelius:#a48be6; --horca:#e6a24d;
  --g-ski:#4fb8d9; --g-horca:#d99a4f; --g-etica:#9b7fd4; --g-infra:#5f9bd6; --g-mem:#d46f9b;
  --shadow:0 18px 50px -18px rgba(0,0,0,.8);
  --font-display:"Fraunces",Georgia,serif;
  --font-body:"Hanken Grotesk",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
  --nav-h:60px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-body); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body.no-scroll{overflow:hidden}
a{color:inherit}
::selection{background:var(--accent);color:#04222a}
button{font-family:inherit;cursor:pointer}
img{max-width:100%}
.mono{font-family:var(--font-mono)}

/* ---------- Nav ---------- */
.nav{
  position:fixed; inset:0 0 auto 0; height:var(--nav-h); z-index:60;
  display:flex; align-items:center; gap:22px; padding:0 clamp(16px,4vw,54px);
  background:linear-gradient(180deg,rgba(7,10,16,.96),rgba(7,10,16,0));
  transition:background .3s ease;
}
.nav.solid{background:rgba(7,10,16,.94); border-bottom:1px solid var(--line); backdrop-filter:blur(10px)}
.brand{display:flex; align-items:center; gap:11px; text-decoration:none; flex:0 0 auto}
.brand .mark{
  width:26px;height:26px;border-radius:7px;flex:0 0 auto;position:relative;
  background:radial-gradient(circle at 32% 30%,var(--accent-strong),var(--accent-deep));
  box-shadow:0 0 0 1px rgba(255,255,255,.12) inset, 0 0 22px -4px var(--accent);
}
.brand .mark::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(120deg,transparent 46%,rgba(255,255,255,.55) 50%,transparent 54%)}
.brand b{font-family:var(--font-mono);font-weight:700;font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--text)}
.brand b span{color:var(--accent)}
.nav-genres{display:flex;gap:4px;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav-genres::-webkit-scrollbar{display:none}
.gpill{
  flex:0 0 auto;background:transparent;border:1px solid transparent;color:var(--text-dim);
  font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;white-space:nowrap;
  transition:.18s;
}
.gpill:hover{color:var(--text)}
.gpill.active{color:#04222a;background:var(--accent);border-color:var(--accent)}
.search{display:flex;align-items:center;gap:8px;flex:0 0 auto;
  background:var(--bg-3);border:1px solid var(--line);border-radius:999px;padding:7px 14px;
  transition:.2s;max-width:240px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(90,209,230,.14)}
.search svg{width:15px;height:15px;flex:0 0 auto;stroke:var(--text-dim)}
.search input{background:none;border:none;outline:none;color:var(--text);font-family:var(--font-body);font-size:13.5px;width:100%;min-width:80px}
.search input::placeholder{color:var(--text-mute)}

/* ---------- Hero ---------- */
.hero{position:relative;min-height:min(90vh,760px);display:flex;align-items:flex-end;
  padding:0 clamp(16px,4vw,54px) clamp(30px,6vh,72px);overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:0}
.hero-bg canvas{width:100%;height:100%;display:block}
.hero-bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(7,10,16,.4) 0%,rgba(7,10,16,0) 32%,rgba(7,10,16,.72) 74%,var(--bg) 100%),
             linear-gradient(90deg,rgba(7,10,16,.86) 0%,rgba(7,10,16,.3) 46%,transparent 72%)}
.hero-inner{position:relative;z-index:1;max-width:640px}
.hero-eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--font-mono);font-size:12px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;flex-wrap:wrap}
.hero-eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.hero-eyebrow .sep{color:var(--text-mute)}
.hero h1{font-family:var(--font-display);font-weight:600;font-size:clamp(2.4rem,6.4vw,4.6rem);
  line-height:.98;margin:0 0 18px;letter-spacing:-.015em;text-wrap:balance;
  text-shadow:0 2px 40px rgba(0,0,0,.5)}
.hero-sum{font-size:clamp(1rem,1.4vw,1.18rem);color:#d5dde6;max-width:56ch;margin:0 0 24px;line-height:1.55}
.hero-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px;font-family:var(--font-mono);font-size:12px;color:var(--text-dim)}
.hero-meta span{border:1px solid var(--line-2);border-radius:6px;padding:4px 9px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;border:none;border-radius:9px;
  padding:12px 22px;font-size:15px;font-weight:700;text-decoration:none;transition:.18s}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--accent);color:#052029}
.btn-primary:hover{background:var(--accent-strong);transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.09);color:var(--text);border:1px solid var(--line-2);backdrop-filter:blur(6px)}
.btn-ghost:hover{background:rgba(255,255,255,.16)}

/* ---------- Rows ---------- */
main{position:relative;z-index:2;margin-top:-30px;padding-bottom:70px}
.row{margin:34px 0}
.row-head{display:flex;align-items:baseline;gap:14px;padding:0 clamp(16px,4vw,54px);margin-bottom:13px}
.row-head h2{font-family:var(--font-display);font-weight:500;font-size:1.32rem;margin:0;letter-spacing:-.01em}
.row-head .count{font-family:var(--font-mono);font-size:11.5px;color:var(--text-mute)}
.row-head .gtag{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.12em;color:var(--text-mute);padding:3px 8px;border:1px solid var(--line);border-radius:5px}
.rail-wrap{position:relative}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;
  padding:6px clamp(16px,4vw,54px);scroll-snap-type:x proximity;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.arrow{position:absolute;top:0;bottom:0;width:clamp(30px,4vw,50px);z-index:12;border:none;
  background:linear-gradient(90deg,rgba(7,10,16,.9),rgba(7,10,16,0));color:var(--text);
  font-size:24px;display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s}
.arrow.r{right:0;background:linear-gradient(270deg,rgba(7,10,16,.9),rgba(7,10,16,0))}
.arrow.l{left:0}
.rail-wrap:hover .arrow{opacity:1}
.arrow:hover{color:var(--accent)}
@media(hover:none){.arrow{display:none}}

/* ---------- Card ---------- */
.card{flex:0 0 auto;width:clamp(180px,22vw,236px);scroll-snap-align:start;
  border-radius:11px;overflow:hidden;background:var(--bg-3);border:1px solid var(--line);
  cursor:pointer;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;position:relative}
.card:hover,.card:focus-visible{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--line-2);outline:none}
.poster{position:relative;aspect-ratio:16/10;overflow:hidden}
.poster canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.poster .pnum{position:absolute;right:11px;bottom:6px;font-family:var(--font-mono);font-weight:700;
  font-size:2.9rem;line-height:1;color:rgba(255,255,255,.9);letter-spacing:-.03em;
  text-shadow:0 2px 18px rgba(0,0,0,.6);pointer-events:none}
.poster .pnum small{font-size:.9rem;opacity:.7;vertical-align:top;margin-right:1px}
.poster .gband{position:absolute;left:0;top:0;bottom:0;width:4px}
.poster .fmt{position:absolute;left:10px;top:9px;font-family:var(--font-mono);font-size:9.5px;
  text-transform:uppercase;letter-spacing:.1em;padding:2px 6px;border-radius:4px;
  background:rgba(0,0,0,.4);color:#fff;backdrop-filter:blur(3px)}
.poster .fmt.nuevo{color:#062;background:rgba(122,224,160,.9)}
.card-body{padding:11px 13px 13px}
/* 2026-08-30 (Ignacio) · «los titulos no se ven porque la fuente es de color negro».
   Esta regla NO declaraba `color`, asi que heredaba y acababa en negro sobre #131a24:
   no es que se leyeran mal, es que no se leian. Turquesa de la propia paleta de la
   pagina (--accent-strong) con halo neon en dos capas: una cerrada para el filo y otra
   abierta para el resplandor. */
.card-body h3{font-family:var(--font-display);font-weight:500;font-size:.97rem;line-height:1.2;margin:0 0 7px;
  color:var(--accent-strong);
  text-shadow:0 0 6px rgba(104,207,212,.55), 0 0 18px rgba(104,207,212,.30), 0 1px 0 rgba(0,0,0,.5);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.35em}
.card:hover .card-body h3{color:#B7E8EB;text-shadow:0 0 8px rgba(144,220,224,.85), 0 0 24px rgba(104,207,212,.45)}
.card-meta{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:10.5px;color:var(--text-mute)}
.card-meta .gdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.card-hoversum{font-size:12px;color:var(--text-dim);line-height:1.45;margin-top:8px;
  max-height:0;opacity:0;overflow:hidden;transition:.24s;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.card:hover .card-hoversum{max-height:6em;opacity:1}

/* ---------- Search results ---------- */
.results{display:none;padding:calc(var(--nav-h) + 26px) clamp(16px,4vw,54px) 80px}
body.searching .hero,body.searching main{display:none}
body.searching .results{display:block}
.results-head{font-family:var(--font-mono);font-size:12.5px;color:var(--text-dim);margin-bottom:20px}
.results-head b{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.empty{color:var(--text-dim);font-size:15px;padding:40px 0}
.empty b{color:var(--text);font-family:var(--font-mono)}

/* ---------- Modal ---------- */
.modal-scrim{position:fixed;inset:0;z-index:100;background:rgba(3,5,9,.78);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .2s}
.modal-scrim.open{display:flex}
.modal-scrim.show{opacity:1}
.modal{width:min(720px,100%);max-height:90vh;overflow-y:auto;background:var(--bg-2);
  border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow);
  transform:translateY(16px) scale(.985);transition:transform .24s cubic-bezier(.2,.7,.3,1);position:relative}
.modal-scrim.show .modal{transform:none}
.modal-hero{position:relative;aspect-ratio:16/7;overflow:hidden;border-radius:16px 16px 0 0}
.modal-hero canvas{position:absolute;inset:0;width:100%;height:100%}
.modal-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,var(--bg-2))}
.modal-hero .m-pnum{position:absolute;right:20px;bottom:8px;font-family:var(--font-mono);font-weight:700;
  font-size:clamp(3rem,9vw,5rem);color:rgba(255,255,255,.92);line-height:1;text-shadow:0 2px 22px rgba(0,0,0,.6)}
.modal-close{position:absolute;top:14px;right:14px;z-index:5;width:36px;height:36px;border-radius:50%;
  border:1px solid var(--line-2);background:rgba(7,10,16,.6);color:#fff;font-size:18px;line-height:1;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:.16s}
.modal-close:hover{background:rgba(7,10,16,.9);color:var(--accent)}
.modal-body{padding:6px clamp(20px,4vw,34px) 30px}
.modal-eyebrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--font-mono);
  font-size:11.5px;color:var(--text-dim);margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:6px;
  border:1px solid var(--line-2);font-family:var(--font-mono);font-size:11px}
.chip .gdot{width:7px;height:7px;border-radius:50%}
.modal h2{font-family:var(--font-display);font-weight:600;font-size:clamp(1.6rem,4vw,2.3rem);
  line-height:1.03;margin:0 0 16px;letter-spacing:-.015em;text-wrap:balance}
.modal p.sum{font-size:1.05rem;line-height:1.6;color:#d5dde6;margin:0 0 22px}
.modal .facts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.fact{background:var(--bg-3);border:1px solid var(--line);border-radius:9px;padding:10px 14px;flex:1 1 120px}
.fact .k{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-mute)}
.fact .v{font-family:var(--font-mono);font-size:1.15rem;font-weight:700;margin-top:3px}
.cast{margin-bottom:24px}
.cast-lbl{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-mute);margin-bottom:9px}
.cast-row{display:flex;gap:9px;flex-wrap:wrap}
.actor{display:flex;align-items:center;gap:8px;background:var(--bg-3);border:1px solid var(--line);border-radius:999px;padding:5px 13px 5px 6px}
.actor .av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-weight:700;font-size:11px;color:#04141a}
.actor .an{font-size:13px;font-weight:600}
.actor .ar{font-size:11px;color:var(--text-mute)}
.modal .m-cta{display:flex;gap:12px;flex-wrap:wrap}

/* footer */
.foot{padding:36px clamp(16px,4vw,54px) 60px;border-top:1px solid var(--line);color:var(--text-mute);font-size:13px;max-width:920px}
.foot b{color:var(--text-dim);font-family:var(--font-mono);font-weight:500}
.foot a{color:var(--accent);text-decoration:none}
.foot a:hover{text-decoration:underline}
.foot .note{font-family:var(--font-mono);font-size:11.5px;margin-top:12px;line-height:1.7}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
@media(max-width:720px){
  .nav-genres{display:none}
  .search{max-width:none;flex:1 1 auto}
  .hero{min-height:70vh}
}
</style>

function classify(text){
  const t = text.toLowerCase();
  const hits = {};
  for(const g of GORDER){
    let s=0; for(const k of GENRES[g].kw){ if(t.includes(k)) s++; }
    if(s>0) hits[g]=s;
  }
  const list = Object.keys(hits).sort((a,b)=>hits[b]-hits[a]||GORDER.indexOf(a)-GORDER.indexOf(b));
  return list.length? list : ["etica"];
}

/* ============ Poster generativo (canvas) ============ */
function hexToRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function drawPoster(canvas, ep, big){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const w = canvas.clientWidth||236, h = canvas.clientHeight||148;
  canvas.width=w*dpr; canvas.height=h*dpr;
  const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
  const hue = GENRES[ep.primary].hue;
  const seed = ep.num*2.399 + ep.id*0.71;
  // fondo degradado alpino nocturno
  const g = ctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0, `hsl(${hue},46%,${big?20:17}%)`);
  g.addColorStop(1, `hsl(${(hue+18)%360},34%,8%)`);
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  // resplandor
  const rg = ctx.createRadialGradient(w*0.72,h*0.22,4, w*0.72,h*0.22, w*0.7);
  rg.addColorStop(0,`hsla(${hue},70%,60%,.34)`); rg.addColorStop(1,`hsla(${hue},70%,60%,0)`);
  ctx.fillStyle=rg; ctx.fillRect(0,0,w,h);
  // crestas de montaña (varias capas seeded)
  function rnd(n){ const x=Math.sin(seed*12.9898+n*78.233)*43758.5453; return x-Math.floor(x); }
  const layers=3;
  for(let L=0;L<layers;L++){
    const baseY = h*(0.5+L*0.16);
    const amp = h*(0.30-L*0.06);
    const light = 12+L*6;
    ctx.beginPath(); ctx.moveTo(0,h);
    let peaks = 3+Math.floor(rnd(L*3)*3);
    ctx.lineTo(0, baseY + Math.sin(seed+L)*amp*0.3);
    for(let p=0;p<=peaks;p++){
      const x=w*(p/peaks);
      const y=baseY - Math.abs(Math.sin(seed*0.7+p*1.7+L*2.1))*amp - rnd(L*10+p)*amp*0.35;
      const xm=w*((p-0.5)/peaks);
      const ym=baseY - Math.abs(Math.sin(seed+p+L))*amp*0.5;
      ctx.quadraticCurveTo(xm, ym, x, y);
    }
    ctx.lineTo(w,h); ctx.closePath();
    ctx.fillStyle=`hsla(${hue},40%,${light}%,${0.9-L*0.12})`;
    ctx.fill();
    // línea de cresta luminosa en la capa frontal
    if(L===layers-1){
      ctx.globalAlpha=.5; ctx.strokeStyle=`hsla(${hue},80%,72%,.7)`; ctx.lineWidth=1; ctx.stroke(); ctx.globalAlpha=1;
    }
  }
  // grano fino de estrellas
  ctx.fillStyle='rgba(255,255,255,.5)';
  for(let s=0;s<(big?60:18);s++){
    const sx=rnd(s)*w, sy=rnd(s+99)*h*0.55, r=rnd(s+7)*0.9+0.2;
    ctx.globalAlpha=rnd(s+3)*0.6+0.1; ctx.beginPath(); ctx.arc(sx,sy,r,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
}

const main = document.getElementById('main');
const posterQueue = [];
function makeCard(ep){
  const el=document.createElement('button');
  el.className='card'; el.type='button';
  el.setAttribute('aria-label',`Episodio ${ep.num}: ${ep.title}`);
  const gc = GENRES[ep.primary];
  el.innerHTML=`
    <div class="poster">
      <canvas></canvas>
      <span class="gband" style="background:${gc.hex}"></span>
      <span class="fmt ${ep.formato==='nuevo'?'nuevo':''}">${ep.formato}</span>
      <span class="pnum"><small>EP</small>${ep.num}</span>
    </div>
    <div class="card-body">
      <h3>${esc(ep.title)}</h3>
      <div class="card-meta">
        <span class="gdot" style="background:${gc.hex}"></span>
        <span>${fmtDate(ep.fecha)}</span><span>·</span><span>${ep.turnos} turnos</span>
      </div>
      <p class="card-hoversum">${esc(ep.sum)}</p>
    </div>`;
  el.addEventListener('click',()=>openModal(ep));
  posterQueue.push([el.querySelector('canvas'),ep,false]);
  return el;
}
function makeRow(title, eps, gkey){
  if(!eps.length) return null;
  const row=document.createElement('section'); row.className='row';
  if(gkey) row.dataset.genre=gkey;
  const gtag = gkey? `<span class="gtag">${GENRES[gkey].label}</span>`:'';
  row.innerHTML=`<div class="row-head"><h2>${title}</h2><span class="count">${eps.length}</span>${gtag}</div>
    <div class="rail-wrap">
      <button class="arrow l" aria-label="Anterior">‹</button>
      <div class="rail"></div>
      <button class="arrow r" aria-label="Siguiente">›</button>
    </div>`;
  const rail=row.querySelector('.rail');
  eps.forEach(ep=>rail.appendChild(makeCard(ep)));
  const step=()=> Math.max(rail.clientWidth*0.82, 260);
  row.querySelector('.arrow.l').addEventListener('click',()=>rail.scrollBy({left:-step(),behavior:'smooth'}));
  row.querySelector('.arrow.r').addEventListener('click',()=>rail.scrollBy({left:step(),behavior:'smooth'}));
  return row;
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtDate(iso){const[y,m,d]=iso.split('-');return `${d} ${MONTHS[m].slice(0,3).toLowerCase()} ${y.slice(2)}`;}
function fmtDateLong(iso){const[y,m,d]=iso.split('-');return `${parseInt(d)} de ${MONTHS[m]} de ${y}`;}

/* Filas */
function buildRows(){
  const sortedDesc=[...EPS].sort(byDateDesc);
  main.appendChild(makeRow('Estrenos', sortedDesc.slice(0,16)));
  const densos=[...EPS].sort((a,b)=>b.turnos-a.turnos||byDateDesc(a,b)).slice(0,16);
  main.appendChild(makeRow('Las sesiones más densas', densos));
  for(const g of GORDER){
    const eps=EPS.filter(e=>e.genres.includes(g)).sort(byDateDesc);
    main.appendChild(makeRow(GENRES[g].label, eps, g));
  }
  // Temporadas por mes (asc dentro, meses desc)
  const months=[...new Set(EPS.map(e=>e.ym))].sort().reverse();
  const seasonHead=document.createElement('div');
  seasonHead.className='row-head'; seasonHead.style.marginTop='46px';
  seasonHead.innerHTML=`<h2 style="font-size:1.6rem">Temporadas</h2><span class="count">${months.length} meses · ${EPS.length} episodios</span>`;
  main.appendChild(seasonHead);
  months.forEach((ym,i)=>{
    const[y,m]=ym.split('-');
    const eps=EPS.filter(e=>e.ym===ym).sort(byDateAsc);
    main.appendChild(makeRow(`${MONTHS[m]} ${y} <span class="mono" style="color:var(--text-mute);font-size:.7em">T${months.length-i}</span>`, eps));
  });
}

function closeModal(){
  scrim.classList.remove('show'); document.body.classList.remove('no-scroll');
  setTimeout(()=>scrim.classList.remove('open'),200);
  if(lastFocus) lastFocus.focus();
}
scrim.addEventListener('click',e=>{ if(e.target===scrim) closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && scrim.classList.contains('open')) closeModal(); });

/* ============ Búsqueda ============ */
const results=document.getElementById('results');
const searchInput=document.getElementById('searchInput');
let searchT;
searchInput.addEventListener('input',()=>{ clearTimeout(searchT); searchT=setTimeout(runSearch,120); });
function runSearch(){
  const q=searchInput.value.trim().toLowerCase();
  if(!q){ document.body.classList.remove('searching'); return; }
  document.body.classList.add('searching');
  const terms=q.split(/\s+/);
  const hits=EPS.filter(e=>terms.every(t=>e.search.includes(t))).sort(byDateDesc);
  results.innerHTML=`<div class="results-head">Resultados para “<b>${esc(searchInput.value.trim())}</b>” · <b>${hits.length}</b> episodio${hits.length!==1?'s':''}</div>`;
  if(!hits.length){
    results.innerHTML+=`<div class="empty">Ningún episodio coincide. Prueba con <b>ruta</b>, <b>HORCA</b>, <b>ética</b>, <b>Portes du Soleil</b> o un número.</div>`;
    return;
  }
  const grid=document.createElement('div'); grid.className='grid';
  hits.forEach(ep=>grid.appendChild(makeCard(ep)));
  results.appendChild(grid);
  flushPosters();
  window.scrollTo({top:0});
}

/* ============ Posters lazy ============ */
const io=new IntersectionObserver((entries)=>{
  entries.forEach(en=>{
    if(en.isIntersecting){
      const cv=en.target;
      const item=posterQueue.find(p=>p[0]===cv);
      if(item && !item[2]){ drawPoster(cv,item[1],false); item[2]=true; }
      io.unobserve(cv);
    }
  });
},{rootMargin:'200px'});
function flushPosters(){ posterQueue.forEach(p=>{ if(!p[2]) io.observe(p[0]); }); }

/* ============ Init ============ */
renderHero();
buildNavGenres();
buildRows();
flushPosters();

document.getElementById('footNote').innerHTML=
  `Catálogo de ${EPS.length} episodios · datos actualizados el 24 ago 2026.<br>`+
  `Nota: la numeración de origen tiene dos episodios 102 y no tiene el 103; se muestran tal cual, sin corregir.`;

// nav sólida al hacer scroll
const nav=document.getElementById('nav');
addEventListener('scroll',()=>{ nav.classList.toggle('solid', scrollY>60); },{passive:true});
// redibujar hero al redimensionar
let rz; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>drawPoster(document.getElementById('heroCanvas'),heroEp,true),200); });
